name: webactueel-starter-ci
services:
  database:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: wordpress-ci-root
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress-ci
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 24
  wordpress:
    image: wordpress:php${PHP_VERSION:-8.3}-apache
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    environment:
      WORDPRESS_DB_HOST: database:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress-ci
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: "define('WP_DEBUG_LOG', true);"
    volumes:
      - wordpress-data:/var/www/html
  cli:
    image: wordpress:cli-php${PHP_VERSION:-8.3}
    # Alpine WP-CLI defaults to UID 82, whereas Debian WordPress writes as UID 33.
    user: "33:33"
    profiles: [tools]
    depends_on:
      database:
        condition: service_healthy
    environment:
      HOME: /tmp
      WORDPRESS_DB_HOST: database:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress-ci
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wordpress-data:/var/www/html
      - ../../dist:/workspace/dist:ro
      - ./seed_woo.php:/workspace/seed_woo.php:ro
      - ./acf_smoke.php:/workspace/acf_smoke.php:ro
volumes:
  db-data: {}
  wordpress-data: {}
