name: Starter source checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Static and security regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Reproducible ZIP build
        run: python3 scripts/package.py
      - name: Validate ZIP contents and hashes
        run: |
          python3 - <<'PY'
          import hashlib, zipfile
          from pathlib import Path
          root = Path('.')
          install = root / 'dist/Webactueel-Block-Starter-1.0.3-STAGING.zip'
          source = root / 'dist/Webactueel-Block-Starter-Source-1.0.3.zip'
          with zipfile.ZipFile(install) as z:
              assert z.testzip() is None
              assert len(z.namelist()) == 12
              assert all(p.startswith('webactueel-starter/') for p in z.namelist())
          with zipfile.ZipFile(source) as z:
              assert z.testzip() is None
              assert 'tests/runtime/run.sh' in z.namelist()
          sums = (root / 'dist/SHA256SUMS.txt').read_text()
          for path in (install, source):
              assert hashlib.sha256(path.read_bytes()).hexdigest() in sums
          print('ZIP audit PASS')
          PY
