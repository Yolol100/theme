name: WordPress runtime smoke
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - wp: '6.6'
            woo: '0'
          - wp: latest
            woo: '0'
          - wp: latest
            woo: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.56.0
          python3 -m playwright install --with-deps chromium
      - name: WordPress and optional WooCommerce smoke
        env:
          WP_TARGET: ${{ matrix.wp }}
          ENABLE_WOO: ${{ matrix.woo }}
        run: bash tests/runtime/run.sh
      - name: Docker logs on failure
        if: failure()
        run: docker compose -f tests/runtime/compose.yaml logs --no-color
      - name: Dispose isolated WordPress databases
        if: always()
        run: docker compose -f tests/runtime/compose.yaml down -v --remove-orphans
