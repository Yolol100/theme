name: WordPress runtime smoke
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    name: build-installable-theme
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12'
      - run: python3 scripts/package.py && (cd dist && sha256sum --check SHA256SUMS.txt)
      - name: Upload the exact installable release
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: runtime-release
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
  runtime:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - wp: '6.6'
            php: '8.3'
            woo: '0'
          - wp: latest
            php: '8.3'
            woo: '0'
          - wp: latest
            php: '8.3'
            woo: '1'
          - wp: latest
            php: '8.4'
            woo: '1'
    env:
      PHP_VERSION: ${{ matrix.php }}
      WP_TARGET: ${{ matrix.wp }}
      ENABLE_WOO: ${{ matrix.woo }}
      BROWSER_ENGINES: ${{ matrix.wp == 'latest' && matrix.php == '8.3' && matrix.woo == '0' && 'chromium,firefox,webkit' || 'chromium' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12'
      - name: Download the one tested theme archive
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: runtime-release
          path: dist
      - name: Refuse an altered release package
        run: (cd dist && sha256sum --check SHA256SUMS.txt)
      - name: Install browser test dependencies
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.56.0
          if [ "$BROWSER_ENGINES" = 'chromium,firefox,webkit' ]; then
            python3 -m playwright install --with-deps chromium firefox webkit
          else
            python3 -m playwright install --with-deps chromium
          fi
      - name: Install pinned axe-core for advisory audits
        if: matrix.wp == 'latest' && matrix.php == '8.3'
        run: npm install --no-save --ignore-scripts --package-lock=false axe-core@4.14.0
      - name: WordPress and optional WooCommerce end-to-end checks
        run: bash tests/runtime/run.sh
      - name: Keep sanitized test receipt
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: runtime-evidence-${{ matrix.wp }}-php${{ matrix.php }}-woo${{ matrix.woo }}
          path: |
            reports/*.json
            reports/screenshots/*.png
          if-no-files-found: warn
          retention-days: 30
      - name: Docker logs on failure
        if: failure()
        run: docker compose -f tests/runtime/compose.yaml logs --no-color
      - name: Dispose isolated WordPress databases
        if: always()
        run: docker compose -f tests/runtime/compose.yaml down -v --remove-orphans
